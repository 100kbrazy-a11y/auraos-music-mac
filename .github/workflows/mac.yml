name: Strata Music for Mac

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Newest Xcode (Liquid Glass needs the macOS 26 SDK)
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)
          if [ -z "$X" ]; then X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true); fi
          if [ -z "$X" ]; then X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          echo "Using $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Version
        id: v
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open("release.json"))["releases"][0]
          print("version=" + r["version"])
          print("name=" + r["name"])
          PY
          python3 - <<'PY'
          import json
          r = json.load(open("release.json"))["releases"][0]
          open("notes.md", "w").write("## " + r["name"] + "\n\n" + "\n".join("- " + n for n in r["notes"]) + "\n\nThe app is signed ad hoc, not notarized: the first time, right-click it and choose Open (or run `xattr -cr \"/Applications/Strata Music.app\"`).\n")
          PY

      - name: Developer ID certificate (only when the secrets exist)
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then echo "No certificate: ad hoc signing"; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain"; KP="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"; security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "SIGN_ID=$ID" >> "$GITHUB_ENV"; echo "Signing as: $ID"

      - name: Build the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/build_app.sh "${{ steps.v.outputs.version }}"

      - name: Smoke test (it starts and stays up)
        continue-on-error: true
        run: |
          "dist/Strata Music.app/Contents/MacOS/StrataMusic" &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then echo "alive after 8 s"; kill $PID; else echo "the app exited early"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Strata-Music-mac
          path: dist/*.dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mac-v${{ steps.v.outputs.version }}"
          TITLE="Strata Music for Mac ${{ steps.v.outputs.version }} - ${{ steps.v.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.dmg dist/*.zip --title "$TITLE" --notes-file notes.md --target "$GITHUB_SHA"
          fi
